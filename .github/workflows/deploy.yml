name: Backend CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node-app:latest
            ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            APP_DIR="/home/${{ secrets.EC2_USER }}/backend"
            IMAGE="${{ secrets.DOCKER_USERNAME }}/node-app:latest"

            echo "======================================"
            echo "Docker login"
            echo "======================================"

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            echo "======================================"
            echo "Preparing application directory"
            echo "======================================"

            mkdir -p "$APP_DIR"

            echo "======================================"
            echo "Creating runtime environment"
            echo "======================================"

            cat > "$APP_DIR/.env" <<'EOF'
            PORT=8000
            NODE_ENV=production
            HOST=0.0.0.0

            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            OTP_JWT_SECRET_KEY=${{ secrets.OTP_JWT_SECRET_KEY }}
            EMAIL_VERIFICATION=verify-email

            PRISMA_CLIENT_ENGINE_TYPE=accelerate

            DATABASE_URL=${{ secrets.DATABASE_URL }}

            WEB_CONCURRENCY=2

            REDIS_URL=${{ secrets.REDIS_URL }}
            REDIS_TLS=true
            REDIS_SSL=true
            EOF

            chmod 600 "$APP_DIR/.env"

            echo "======================================"
            echo "Validating runtime env file"
            echo "======================================"

            test -s "$APP_DIR/.env"

            grep -q '^REDIS_URL=.\+' "$APP_DIR/.env"
            grep -q '^DATABASE_URL=.\+' "$APP_DIR/.env"

            echo "REDIS_URL exists in runtime .env"
            echo "DATABASE_URL exists in runtime .env"

            echo "======================================"
            echo "Pulling latest Docker image"
            echo "======================================"

            docker pull "$IMAGE"

            echo "======================================"
            echo "Stopping old container"
            echo "======================================"

            docker stop myapp || true
            docker rm -f myapp || true

            echo "======================================"
            echo "Starting new container"
            echo "======================================"

            docker run -d \
              --name myapp \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env" \
              -p 8000:8000 \
              "$IMAGE"

            echo "======================================"
            echo "Waiting for container"
            echo "======================================"

            sleep 10

            echo "======================================"
            echo "Checking container"
            echo "======================================"

            docker ps --filter "name=myapp"

            echo "======================================"
            echo "Checking REDIS_URL inside container"
            echo "======================================"

            docker exec myapp node -e "
              if (process.env.REDIS_URL) {
                console.log('REDIS_URL: OK');
              } else {
                console.error('REDIS_URL: MISSING');
                process.exit(1);
              }
            "

            echo "======================================"
            echo "Checking Redis TLS settings"
            echo "======================================"

            docker exec myapp node -e "
              console.log('REDIS_TLS:', process.env.REDIS_TLS);
              console.log('REDIS_SSL:', process.env.REDIS_SSL);
            "

            echo "======================================"
            echo "Checking PM2"
            echo "======================================"

            docker exec myapp pm2 status

            echo "======================================"
            echo "Application logs"
            echo "======================================"

            docker logs --tail 100 myapp

            echo "======================================"
            echo "Health check"
            echo "======================================"

            curl -fsS http://localhost:8000

            echo ""
            echo "======================================"
            echo "Deployment complete"
            echo "======================================"

  cleanup-ec2:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Cleanup old Docker images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo "Cleanup complete."