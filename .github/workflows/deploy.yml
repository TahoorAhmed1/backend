name: Backend CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node-app:latest
            ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Logging into Docker Hub"
            echo "======================================"

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            echo "======================================"
            echo "Pulling latest image"
            echo "======================================"

            docker pull ${{ secrets.DOCKER_USERNAME }}/node-app:latest

            echo "======================================"
            echo "Checking existing .env"
            echo "======================================"

            if [ ! -f /home/${{ secrets.EC2_USER }}/backend/.env ]; then
              echo "ERROR: .env file not found!"
              exit 1
            fi

            chmod 600 /home/${{ secrets.EC2_USER }}/backend/.env

            echo "Existing .env found."

            echo "======================================"
            echo "Stopping old container"
            echo "======================================"

            docker stop myapp || true
            docker rm -f myapp || true

            echo "======================================"
            echo "Starting new container"
            echo "======================================"

            docker run -d \
              --name myapp \
              -p 8000:8000 \
              --restart unless-stopped \
              --env-file /home/${{ secrets.EC2_USER }}/backend/.env \
              ${{ secrets.DOCKER_USERNAME }}/node-app:latest

            echo "======================================"
            echo "Container status"
            echo "======================================"

            docker ps

            echo "======================================"
            echo "Waiting for application"
            echo "======================================"

            sleep 10

            echo "======================================"
            echo "Application logs"
            echo "======================================"

            docker logs --tail 50 myapp

            echo "======================================"
            echo "Health check"
            echo "======================================"

            curl -fsS http://localhost:8000 || true

            echo "======================================"
            echo "Deployment complete"
            echo "======================================"


  cleanup-ec2:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Prune old Docker images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            sleep 10

            echo "Cleaning up old Docker images..."

            docker image prune -f

            echo "Server cleanup complete."