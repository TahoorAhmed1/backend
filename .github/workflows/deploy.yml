name: Backend CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/ibex' }}

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 5️⃣ Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node-app:latest
            ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }}
          cache-from: type=inline
          cache-to: type=inline

      # 6️⃣ Deploy Node.js on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔹 Logging into Docker Hub on EC2..."
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            echo "🔹 Pulling the latest backend image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/node-app:latest

            echo "🔹 Stopping any old app instance..."
            docker stop myapp || true
            docker rm -f myapp || true

            echo "🔹 Starting the app automatically..."
            if [ -f /home/${{ secrets.EC2_USER }}/backend/docker-compose.yml ]; then
              cd /home/${{ secrets.EC2_USER }}/backend
              docker compose down || true
              docker compose up -d --force-recreate
            else
              docker run -d \
                --name myapp \
                -p 3000:3000 \
                --restart unless-stopped \
                -e NODE_ENV=production \
                -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
                ${{ secrets.DOCKER_USERNAME }}/node-app:latest
            fi

            echo "🔹 Verifying running containers..."
            docker ps

            echo "🔹 Checking app health..."
            curl -fsS http://localhost:3000 || true

      # 7️⃣ Deployment complete
      - name: Done
        run: echo "✅ Backend deployed successfully!"

  cleanup-ec2:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Prune old images on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 10
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f
            echo "✨ Server cleanup complete."