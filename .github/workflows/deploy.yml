name: Backend CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/ibex' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Required: log in to Docker Hub ──────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}   # must be an Access Token, not the account password

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node-app:latest
            ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }}
          # Better cache (inline often fails with the default builder)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔹 Logging into Docker Hub on EC2..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "🔹 Pulling the latest backend image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/node-app:latest

            echo "🔹 Stopping any old app instance..."
            docker stop myapp || true
            docker rm -f myapp || true

            echo "🔹 Starting the app..."
            if [ -f /home/${{ secrets.EC2_USER }}/backend/docker-compose.yml ]; then
              cd /home/${{ secrets.EC2_USER }}/backend
              docker compose down || true
              docker compose up -d --force-recreate
            else
              docker run -d \
                --name myapp \
                -p 3000:3000 \
                --restart unless-stopped \
                -e NODE_ENV=production \
                -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
                ${{ secrets.DOCKER_USERNAME }}/node-app:latest
            fi

            echo "🔹 Verifying running containers..."
            docker ps

            echo "🔹 Checking app health..."
            curl -fsS http://localhost:3000 || true

      - name: Done
        run: echo "✅ Backend deployed successfully!"

  cleanup-ec2:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Prune old images on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 10
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f
            echo "✨ Server cleanup complete."