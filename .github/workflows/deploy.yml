name: Backend CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/ibex' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Required: log in to Docker Hub ──────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}   # must be an Access Token, not the account password

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node-app:latest
            ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }}
          # Better cache (inline often fails with the default builder)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TLS: ${{ secrets.REDIS_TLS || 'false' }}
          REDIS_SSL: ${{ secrets.REDIS_SSL || 'false' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          OTP_JWT_SECRET_KEY: ${{ secrets.OTP_JWT_SECRET_KEY }}
          EMAIL_VERIFICATION: ${{ secrets.EMAIL_VERIFICATION }}
          HOST: ${{ secrets.HOST }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔹 Logging into Docker Hub on EC2..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "🔹 Pulling the latest backend image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/node-app:latest

            echo "🔹 Preparing runtime env file..."
            mkdir -p /home/${{ secrets.EC2_USER }}/backend
            cat > /home/${{ secrets.EC2_USER }}/backend/.env <<EOF
            PORT=8000
            NODE_ENV=production
            DATABASE_URL=${DATABASE_URL}
            REDIS_URL=${REDIS_URL}
            REDIS_TLS=${REDIS_TLS:-false}
            REDIS_SSL=${REDIS_SSL:-false}
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            OTP_JWT_SECRET_KEY=${OTP_JWT_SECRET_KEY}
            EMAIL_VERIFICATION=${EMAIL_VERIFICATION}
            HOST=${HOST}
            WEB_CONCURRENCY=2
            EOF
            chmod 600 /home/${{ secrets.EC2_USER }}/backend/.env

            echo "🔹 Stopping any old app instance..."
            docker stop myapp || true
            docker rm -f myapp || true

            echo "🔹 Starting the app..."
            if [ -f /home/${{ secrets.EC2_USER }}/backend/docker-compose.yml ]; then
              cd /home/${{ secrets.EC2_USER }}/backend
              docker compose down || true
              docker compose up -d --force-recreate
            else
              docker run -d \
                --name myapp \
                -p 8000:8000 \
                --restart unless-stopped \
                --env-file /home/${{ secrets.EC2_USER }}/backend/.env \
                ${{ secrets.DOCKER_USERNAME }}/node-app:latest
            fi

            echo "🔹 Verifying running containers..."
            docker ps

            echo "🔹 Checking app health..."
            curl -fsS http://localhost:8000 || true

      - name: Done
        run: echo "✅ Backend deployed successfully!"

  cleanup-ec2:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Prune old images on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 10
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f
            echo "✨ Server cleanup complete."